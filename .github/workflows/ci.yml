name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Upstream packages move without a push. The weekly run catches that drift.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the previous run. Every other run gets its
# own group, because a shared group cancels a pending run even when
# cancel-in-progress is false, and every commit on main must finish a full run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether a pull request needs the platform jobs. This is a job and not
  # a workflow-level paths filter, because a filtered workflow leaves its required
  # checks pending forever. Pushes to main and scheduled runs always run them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs-checks: ${{ steps.classify.outputs.needs-checks }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The merge commit and its base-branch parent.
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          needs_checks=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # --no-renames lists both sides, so moving code into docs/ still counts.
            git diff --no-renames --name-only HEAD^1 HEAD >"$RUNNER_TEMP/changed-paths"
            cat "$RUNNER_TEMP/changed-paths"
            needs_checks="$(bash bootstrap/scripts/ci-needs-checks.sh <"$RUNNER_TEMP/changed-paths")"
          fi
          echo "needs-checks=$needs_checks" >>"$GITHUB_OUTPUT"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run gitleaks (repository scan)
        # The gitleaks rev in .pre-commit-config.yaml is the only version pin.
        # The pre-commit hook only scans staged changes, so CI scans the whole tree.
        run: |
          version="$(yq -r '.repos[] | select(.repo == "https://github.com/gitleaks/gitleaks") | .rev' \
            .pre-commit-config.yaml)" || exit 1
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: expected one gitleaks rev vX.Y.Z in .pre-commit-config.yaml, got: $version" >&2
            exit 1
          fi
          version="${version#v}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          ./gitleaks dir --redact --verbose .

  # Source-level checks: render templates, validate contracts, and exercise
  # selected behavior with stubs and temporary roots.
  smoke:
    name: smoke-tests-${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.needs-checks == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    env:
      SMOKE_SHELLCHECK: ${{ matrix.shellcheck }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ShellCheck output does not depend on the host, so one platform runs it.
          - platform: linux
            runner: ubuntu-latest
            shellcheck: true
            setup: |
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                curl git zsh bash-completion bat ca-certificates xz-utils shellcheck fontconfig zip unzip
              mkdir -p "$HOME/.local/bin"
              sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          - platform: macos
            runner: macos-latest
            shellcheck: false
            # Every `bash` the suite starts resolves to macOS /bin/bash, the
            # oldest Bash the baseline supports.
            setup: |
              mkdir -p "$HOME/.local/bin"
              sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              mkdir -p "$RUNNER_TEMP/system-bash"
              ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
              echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
          - platform: arch
            runner: ubuntu-latest
            container: archlinux:base
            shellcheck: false
            setup: |
              pacman -Syu --needed --noconfirm git chezmoi zsh bash-completion bat diffutils fontconfig zip unzip
    steps:
      - name: Prepare the platform
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - name: Run smoke tests
        run: bash bootstrap/scripts/run-smoke-tests.sh

  # A real clean-machine round trip: apply, reapply, uninstall, and restore.
  apply:
    name: apply-${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.needs-checks == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The non-desktop server path.
          - platform: linux
            runner: ubuntu-latest
            desktop: false
            go-build-cache: ~/.cache/go-build
            setup: |
              mkdir -p "$HOME/.local/bin"
              sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          - platform: ubuntu-desktop
            runner: ubuntu-latest
            container: ubuntu:26.04
            desktop: true
            go-build-cache: ~/.cache/go-build
            setup: |
              # A disposable container does not need dpkg to fsync every file.
              echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/force-unsafe-io
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl git sudo
              mkdir -p "$HOME/.local/bin"
              sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          - platform: arch
            runner: ubuntu-latest
            container: archlinux:base
            desktop: true
            go-build-cache: ~/.cache/go-build
            setup: |
              pacman -Syu --needed --noconfirm git curl chezmoi sudo
          - platform: macos
            runner: macos-latest
            desktop: true
            go-build-cache: ~/Library/Caches/go-build
            setup: |
              mkdir -p "$HOME/.local/bin"
              sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> "$GITHUB_ENV"
    steps:
      - name: Prepare the platform
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      # gopls and dlv have no official prebuilt binaries, and compiling them is
      # the slowest part of the round trip. The weekly run stays uncached, so it
      # still proves a truly clean install from upstream.
      - name: Restore the Go tool build cache
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.go-build-cache }}
            ~/go/pkg/mod
          key: go-tools-${{ matrix.platform }}-${{ hashFiles('bootstrap/manifests/ecosystem/go-tools.txt', 'dot_config/mise/config.toml.tmpl') }}
      - name: Run the clean-machine round trip
        run: bash bootstrap/scripts/ci-apply.sh "${{ matrix.desktop }}"

  # The one required status check on main. A job skipped by a condition reports
  # success, and a skipped matrix job reports its unexpanded name, so branch
  # protection cannot require the platform jobs directly. always() keeps this
  # job from being skipped, because a skipped required check counts as passing.
  ci-gate:
    needs: [changes, secret-scan, smoke, apply]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES: ${{ needs.changes.result }}
      SECRET_SCAN: ${{ needs.secret-scan.result }}
      SMOKE: ${{ needs.smoke.result }}
      APPLY: ${{ needs.apply.result }}
      NEEDS_CHECKS: ${{ needs.changes.outputs.needs-checks }}
    steps:
      - name: Require every job that had to run
        shell: bash
        run: |
          echo "changes=$CHANGES secret-scan=$SECRET_SCAN smoke=$SMOKE apply=$APPLY needs-checks=$NEEDS_CHECKS"
          [[ "$CHANGES" == success && "$SECRET_SCAN" == success ]]
          case "$NEEDS_CHECKS" in
            true) [[ "$SMOKE" == success && "$APPLY" == success ]] ;;
            false) [[ "$SMOKE" == skipped && "$APPLY" == skipped ]] ;;
            *) exit 1 ;;
          esac
