name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  smoke-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl git zsh bash-completion bat ca-certificates xz-utils shellcheck fontconfig
      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run smoke tests
        run: bash bootstrap/scripts/run-smoke-tests.sh

  smoke-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install smoke dependencies
        run: brew install chezmoi shellcheck
      - name: Run smoke tests
        # Runs the suite against macOS tools and the system Bash 3.2.
        run: bash bootstrap/scripts/run-smoke-tests.sh

  smoke-tests-arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install smoke dependencies
        run: pacman -Syu --needed --noconfirm git chezmoi shellcheck zsh bash-completion bat diffutils fontconfig
      - uses: actions/checkout@v7
      - name: Run smoke tests
        run: bash bootstrap/scripts/run-smoke-tests.sh
